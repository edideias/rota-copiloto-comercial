name: Teste de leitura (prints reais)

on:
  push:
    paths: ["app/src/**", ".github/workflows/teste-leitura.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Liga KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepara dados
        run: mkdir -p app/src/main/assets && cp dados/campo-grande-ruas.json app/src/main/assets/ruas.json
      - name: Roda no Android emulado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c
            gradle connectedDebugAndroidTest --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || true
            adb logcat -d -s LEITOR:I > leitura.txt
            cat leitura.txt
            mkdir -p telas && adb pull /sdcard/Android/data/br.rota.copiloto.pro/files/. telas/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-leitura
          path: |
            leitura.txt
            telas/
      - name: Publica as telas desenhadas
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: telas-teste
          name: Telas do teste (não é versão do app)
          prerelease: true
          make_latest: false
          files: |
            telas/*.png
            leitura.txt
