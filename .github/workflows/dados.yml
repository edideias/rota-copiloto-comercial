name: Atualizar banco de ruas

on:
  push:
    paths: ["scripts/gerar_ruas.py", ".github/workflows/dados.yml"]
  schedule:
    - cron: "17 6 1 * *"   # todo dia 1, de madrugada
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ruas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Baixar ruas e bairros do OpenStreetMap
        run: python scripts/gerar_ruas.py
      - name: Salvar no repositório
        run: |
          git config user.name "rota-dados"; git config user.email "rota-dados@users.noreply.github.com"
          git add dados/campo-grande-ruas.json
          git diff --cached --quiet || git commit -m "Atualiza banco de ruas de Campo Grande [skip ci]"
          git pull --rebase -q && git push
