name: Sondar mapas da Prefeitura
on:
  push:
    paths: ["scripts/sondar_mapas.py"]
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p dados && python3 scripts/sondar_mapas.py
      - run: |
          git config user.name rota-dados; git config user.email rota-dados@users.noreply.github.com
          git add dados/sondagem.txt dados/pavimentacao-oficial.geojson 2>/dev/null; git add dados/sondagem.txt; git commit -m "sondagem [skip ci]" && git pull --rebase -q && git push
