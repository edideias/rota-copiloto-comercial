name: Compilar APK

on:
  push:
    paths-ignore: ["dados/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Chave de assinatura
        env:
          RC_KEYSTORE_B64: ${{ secrets.RC_KEYSTORE_B64 }}
        run: |
          # Sem a chave certa o APK sairia com outra assinatura e ninguém conseguiria atualizar: para o build.
          if [ -z "$RC_KEYSTORE_B64" ]; then echo "::error::Segredo RC_KEYSTORE_B64 ausente: configure os segredos do repositório"; exit 1; fi
          echo "$RC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rc.keystore"
          echo "RC_KEYSTORE_PATH=$RUNNER_TEMP/rc.keystore" >> "$GITHUB_ENV"

      - name: Baixar modelo de voz em português (Vosk)
        run: |
          # Modelo pequeno em pt-BR, empacotado no APK para o reconhecimento funcionar offline.
          curl -fsSL -o "$RUNNER_TEMP/vosk-pt.zip" https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q "$RUNNER_TEMP/vosk-pt.zip" -d "$RUNNER_TEMP/vosk"
          rm -rf app/src/main/assets/model-pt
          mv "$RUNNER_TEMP/vosk/vosk-model-small-pt-0.3" app/src/main/assets/model-pt
          ls app/src/main/assets/model-pt

      - name: Compilar
        env:
          RC_STORE_PASSWORD: ${{ secrets.RC_STORE_PASSWORD }}
          RC_KEY_PASSWORD: ${{ secrets.RC_KEY_PASSWORD }}
          RC_KEY_ALIAS: ${{ secrets.RC_KEY_ALIAS }}
        run: |
          set -o pipefail
          mkdir -p app/src/main/assets && cp dados/campo-grande-ruas.json app/src/main/assets/ruas.json
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar erros de compilação
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A1 build.log | head -30 | sed 's/^/::error::/' || true

      - uses: actions/upload-artifact@v4
        with:
          name: RotaCopiloto-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publica o APK numa "Release": link de download direto, fácil de abrir no celular.
      # Com DIST_TOKEN cadastrado, a release vai para o repositório público de distribuição
      # (o código-fonte pode ficar privado). Sem ele, continua saindo aqui mesmo.
      - name: Publicar APK (distribuição)
        if: env.DIST_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: edideias/rota-calculadora-apk
          token: ${{ env.DIST_TOKEN }}
          tag_name: build-${{ github.run_number }}
          name: Rota Calculadora (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      - name: Publicar APK (este repositório)
        if: env.DIST_TOKEN == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rota Calculadora (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
