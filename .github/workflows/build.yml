name: Compilar APK

on:
  push:
    paths-ignore: ["dados/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar erros de compilação
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A1 build.log | head -30 | sed 's/^/::error::/' || true

      - uses: actions/upload-artifact@v4
        with:
          name: RotaCopiloto-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publica o APK numa "Release": link de download direto, fácil de abrir no celular.
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rota Calculadora (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
